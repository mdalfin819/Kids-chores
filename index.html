<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chores">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Track kids' chores and allowance">
<title>Chore Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
:root {
  --bg: #F0F4FF;
  --card: #FFFFFF;
  --ink: #1E1B4B;
  --muted: #64748B;
  --primary: #4F46E5;
  --primary-dark: #3730A3;
  --accent: #10B981;
  --warn: #F59E0B;
  --danger: #EF4444;
  --reuven: #6366F1;
  --lev: #EC4899;
  --shadow: 0 4px 20px rgba(79,70,229,.12);
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100%; }
body { padding-top: var(--safe-t); padding-bottom: calc(20px + var(--safe-b)); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: none; background: none; }
.app { max-width: 480px; margin: 0 auto; padding: 12px 14px 40px; }
.header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.25rem; letter-spacing: -.02em; }
.logo-badge { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg,#4F46E5,#818CF8);
  display: grid; place-items: center; color: #fff; font-size: 1.1rem; box-shadow: var(--shadow); }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow);
  display: grid; place-items: center; font-size: 1.15rem; color: var(--ink); }
.icon-btn:active { transform: scale(.96); }
.kid-switcher { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.kid-switcher::-webkit-scrollbar { display: none; }
.kid-chip { flex: 0 0 auto; min-width: 100px; padding: 12px 16px; border-radius: 999px; background: var(--card);
  box-shadow: var(--shadow); font-weight: 700; font-size: 1rem; color: var(--muted); border: 2px solid transparent;
  transition: .15s; }
.kid-chip.active { color: #fff; border-color: transparent; }
.kid-chip.add { border: 2px dashed #C7D2FE; color: var(--primary); background: #EEF2FF; box-shadow: none; }
.balance-card { background: linear-gradient(145deg, var(--primary), #7C3AED); color: #fff; border-radius: 24px;
  padding: 22px 20px 18px; box-shadow: 0 10px 30px rgba(79,70,229,.35); margin-bottom: 16px; position: relative; overflow: hidden; }
.balance-card::after { content: ''; position: absolute; right: -30px; top: -30px; width: 140px; height: 140px;
  border-radius: 50%; background: rgba(255,255,255,.1); }
.balance-label { font-size: .9rem; opacity: .9; font-weight: 600; }
.balance-amt { font-size: 3rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin: 4px 0 12px; }
.balance-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 12px 18px;
  border-radius: 14px; font-weight: 700; font-size: 1rem; transition: .12s; }
.btn:active { transform: scale(.97); }
.btn-primary { background: #fff; color: var(--primary); }
.btn-ghost { background: rgba(255,255,255,.2); color: #fff; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-outline { background: var(--card); color: var(--ink); border: 2px solid #E2E8F0; }
.btn-block { width: 100%; }
.section { margin-bottom: 18px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.section-title { font-size: 1.05rem; font-weight: 800; margin: 0; }
.linkish { color: var(--primary); font-weight: 700; font-size: .9rem; padding: 8px; }
.chore-grid { display: grid; gap: 10px; }
.chore-item { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: var(--radius);
  padding: 14px 14px 14px 16px; box-shadow: var(--shadow); min-height: 64px; text-align: left; width: 100%; }
.chore-item:active { transform: scale(.985); background: #EEF2FF; }
.chore-emoji { font-size: 1.6rem; width: 44px; height: 44px; border-radius: 12px; background: #EEF2FF;
  display: grid; place-items: center; flex-shrink: 0; }
.chore-meta { flex: 1; min-width: 0; }
.chore-name { font-weight: 700; font-size: 1.05rem; }
.chore-pay { color: var(--accent); font-weight: 800; font-size: 1.05rem; }
.chore-edit { width: 40px; height: 40px; border-radius: 12px; color: var(--muted); font-size: 1.1rem; }
.weekly { background: var(--card); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
  display: flex; justify-content: space-between; align-items: center; }
.weekly strong { color: var(--accent); font-size: 1.2rem; }
.history { display: flex; flex-direction: column; gap: 8px; }
.hist-item { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px;
  padding: 12px 12px 12px 14px; box-shadow: 0 2px 10px rgba(15,23,42,.05); }
.hist-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.hist-dot.earn { background: var(--accent); }
.hist-dot.pay { background: var(--warn); }
.hist-body { flex: 1; min-width: 0; }
.hist-title { font-weight: 700; font-size: .95rem; }
.hist-date { color: var(--muted); font-size: .8rem; }
.hist-amt { font-weight: 800; white-space: nowrap; }
.hist-amt.earn { color: var(--accent); }
.hist-amt.pay { color: var(--warn); }
.hist-del { width: 40px; height: 40px; border-radius: 10px; color: var(--danger); font-size: 1rem; }
.empty { text-align: center; color: var(--muted); padding: 24px 12px; font-size: .95rem; }
.toast { position: fixed; left: 50%; bottom: calc(24px + var(--safe-b)); transform: translateX(-50%) translateY(120%);
  background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 700; font-size: .95rem;
  z-index: 100; transition: transform .25s ease; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 90vw;
  display: flex; align-items: center; gap: 12px; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast button { color: #A5B4FC; font-weight: 800; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 200; display: none;
  align-items: flex-end; justify-content: center; padding: 12px; padding-bottom: calc(12px + var(--safe-b)); }
.modal-backdrop.open { display: flex; }
.modal { background: #fff; width: 100%; max-width: 480px; border-radius: 24px 24px 20px 20px; padding: 20px 18px 16px;
  max-height: 90vh; overflow: auto; box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
.modal h2 { margin: 0 0 14px; font-size: 1.25rem; }
.field { margin-bottom: 12px; }
.field label { display: block; font-weight: 700; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
.field input, .field select, .field textarea { width: 100%; min-height: 48px; padding: 12px 14px; border-radius: 14px;
  border: 2px solid #E2E8F0; background: #F8FAFC; font-size: 1.05rem; outline: none; }
.field input:focus, .field textarea:focus { border-color: var(--primary); background: #fff; }
.field textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
.modal-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.modal-actions .btn { flex: 1; min-width: 120px; }
.pin-dots { display: flex; gap: 12px; justify-content: center; margin: 12px 0 18px; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #C7D2FE; background: transparent; }
.pin-dot.filled { background: var(--primary); border-color: var(--primary); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 280px; margin: 0 auto 12px; }
.pin-key { min-height: 56px; border-radius: 16px; background: #EEF2FF; font-size: 1.4rem; font-weight: 800; color: var(--ink); }
.pin-key:active { background: #C7D2FE; }
.lock-banner { background: #FEF3C7; color: #92400E; border-radius: 14px; padding: 10px 14px; font-weight: 700;
  font-size: .9rem; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tabs { display: flex; gap: 6px; background: #E0E7FF; padding: 4px; border-radius: 14px; margin-bottom: 14px; }
.tab { flex: 1; min-height: 42px; border-radius: 11px; font-weight: 700; color: var(--muted); }
.tab.active { background: #fff; color: var(--primary); box-shadow: 0 2px 8px rgba(79,70,229,.15); }
.quick-amts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { min-height: 42px; padding: 8px 14px; border-radius: 999px; background: #EEF2FF; color: var(--primary); font-weight: 700; }
.chip.active { background: var(--primary); color: #fff; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

.goals-section { margin-bottom: 18px; }
.goal-card { background: var(--card); border-radius: var(--radius); padding: 14px 14px 12px;
  box-shadow: var(--shadow); margin-bottom: 10px; }
.goal-card.ready { background: linear-gradient(135deg, #ECFDF5, #D1FAE5); border: 2px solid #34D399; }
.goal-card.achieved { opacity: .85; }
.goal-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.goal-emoji { font-size: 1.7rem; width: 48px; height: 48px; border-radius: 14px; background: #EEF2FF;
  display: grid; place-items: center; flex-shrink: 0; }
.goal-card.ready .goal-emoji { background: #A7F3D0; }
.goal-info { flex: 1; min-width: 0; }
.goal-name { font-weight: 800; font-size: 1.05rem; }
.goal-meta { color: var(--muted); font-size: .85rem; font-weight: 600; margin-top: 2px; }
.goal-actions { display: flex; gap: 4px; flex-shrink: 0; }
.goal-actions button { width: 40px; height: 40px; border-radius: 12px; font-size: 1.05rem; color: var(--muted); }
.goal-bar { height: 18px; background: #E0E7FF; border-radius: 999px; overflow: hidden; margin: 8px 0 8px; }
.goal-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6366F1, #A78BFA);
  transition: width .35s ease; min-width: 0; }
.goal-card.ready .goal-bar-fill { background: linear-gradient(90deg, #10B981, #34D399); }
.goal-progress-text { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  font-size: .9rem; font-weight: 700; }
.goal-progress-text .saved { color: var(--accent); }
.goal-progress-text .togo { color: var(--muted); }
.goal-estimate { font-size: .82rem; color: var(--muted); margin-top: 6px; font-weight: 600; }
.goal-ready-badge { display: inline-flex; align-items: center; gap: 4px; background: #10B981; color: #fff;
  font-weight: 800; font-size: .85rem; padding: 6px 12px; border-radius: 999px; margin-top: 8px; }
.goal-buy { margin-top: 10px; width: 100%; min-height: 44px; border-radius: 12px; background: var(--accent);
  color: #fff; font-weight: 800; }
.goal-achieved-label { font-size: .85rem; color: var(--muted); font-weight: 700; margin-top: 4px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="logo"><div class="logo-badge">✨</div><span>Chore Tracker</span></div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="btnMenu" title="Menu" aria-label="Menu">☰</button>
    </div>
  </div>

  <div id="lockBanner" class="lock-banner hidden">
    <span>🔒 Editing locked</span>
    <button class="linkish" id="btnUnlock" style="color:#92400E">Unlock</button>
  </div>

  <div class="kid-switcher" id="kidSwitcher"></div>

  <div class="balance-card" id="balanceCard">
    <div class="balance-label" id="balanceLabel">Balance</div>
    <div class="balance-amt" id="balanceAmt">$0.00</div>
    <div class="balance-actions">
      <button class="btn btn-primary" id="btnPayout">💵 Pay out</button>
      <button class="btn btn-ghost" id="btnUndo" disabled>↩ Undo</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="chores">Chores</button>
    <button class="tab" data-tab="history">History</button>
  </div>

  <div id="tabChores">
    <div class="section">
      <div class="weekly">
        <span>This week earned</span>
        <strong id="weeklyEarned">$0.00</strong>
      </div>
    </div>
    <div class="section goals-section">
      <div class="section-head">
        <h2 class="section-title">🎯 Goals</h2>
        <button class="linkish" id="btnAddGoal">+ Add</button>
      </div>
      <div id="goalsList"></div>
      <div id="achievedWrap" class="hidden" style="margin-top:14px">
        <div class="section-head">
          <h2 class="section-title" style="font-size:.95rem;color:var(--muted)">Achieved</h2>
        </div>
        <div id="achievedList"></div>
      </div>
    </div>
    <div class="section">
      <div class="section-head">
        <h2 class="section-title">Tap a chore</h2>
        <button class="linkish" id="btnAddChore">+ Add</button>
      </div>
      <div class="chore-grid" id="choreList"></div>
    </div>
  </div>

  <div id="tabHistory" class="hidden">
    <div class="section">
      <div class="section-head">
        <h2 class="section-title">History</h2>
        <button class="linkish" id="btnClearHistory" style="color:var(--danger)">Clear</button>
      </div>
      <div class="history" id="historyList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" class="hidden">Undo</button></div>

<div class="modal-backdrop" id="modal">
  <div class="modal" id="modalBody" role="dialog" aria-modal="true"></div>
</div>

<script>
const STORAGE_KEY = 'chore-tracker-v1';
const CHORES_DATA_VERSION = 2;
const DEFAULT_CHORES = [
  { id: 'c1', name: 'Make bed', amount: 1, emoji: '🛏️' },
  { id: 'c2', name: 'Take out trash', amount: 2, emoji: '🗑️' },
  { id: 'c3', name: 'Clean room', amount: 3, emoji: '🧹' },
  { id: 'c4', name: 'Set table', amount: 1, emoji: '🍽️' },
  { id: 'c5', name: 'Put away toys', amount: 1, emoji: '🧸' },
  { id: 'c6', name: 'Laundry (fold & put away)', amount: 2, emoji: '👕' },
  { id: 'c7', name: 'Take out recycling', amount: 1, emoji: '♻️' },
  { id: 'c8', name: 'Homework right after school', amount: 2, emoji: '📚' },
  { id: 'c9', name: 'Clean up toys', amount: 1, emoji: '🪀' },
  { id: 'c10', name: 'Slept in own bed', amount: 1, emoji: '😴' },
  { id: 'c11', name: 'Clear table after dinner', amount: 1, emoji: '🍽️' },
  { id: 'c12', name: 'Put shoes & backpack away', amount: 0.5, emoji: '🎒' },
  { id: 'c13', name: 'Brush teeth morning & night', amount: 0.5, emoji: '🪥' },
  { id: 'c14', name: 'Get dressed & ready on time', amount: 1, emoji: '👔' },
  { id: 'c15', name: 'Help unload dishwasher', amount: 1, emoji: '🍽️' },
  { id: 'c16', name: 'Read 20 minutes', amount: 1, emoji: '📖' },
];
const DEFAULT_KIDS = [
  { id: 'k1', name: 'Reuven', color: '#6366F1' },
  { id: 'k2', name: 'Lev', color: '#EC4899' },
];
const COLORS = ['#6366F1','#EC4899','#10B981','#F59E0B','#06B6D4','#8B5CF6','#EF4444','#14B8A6'];

let state = loadState();
let lastAction = null; // { type, kidId, entryId, prevBalance }
let toastTimer = null;
let unlocked = !state.pinHash; // if no pin, always unlocked for editing
let pendingPinAction = null;

function uid(prefix){ return prefix + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (!s.kids || !s.chores || !s.entries) throw new Error('bad');
      if (!Array.isArray(s.goals)) s.goals = [];
      migrateChores(s);
      return s;
    }
  } catch(e){}
  return {
    kids: DEFAULT_KIDS.map(k => ({...k})),
    chores: DEFAULT_CHORES.map(c => ({...c})),
    entries: [], // {id, kidId, type:'chore'|'payout', choreId?, name, amount, ts}
    goals: [], // {id, kidId, name, price, emoji, achieved, achievedAt?}
    selectedKidId: DEFAULT_KIDS[0].id,
    pinHash: null,
    choresDataVersion: CHORES_DATA_VERSION,
  };
}
function migrateChores(s){
  const ver = Number(s.choresDataVersion) || 0;
  if (ver >= CHORES_DATA_VERSION) return;
  // Add any default chores missing by name (case-insensitive) exactly once.
  // Never alter balances, history, or existing chores. Deleted chores won't return after version bump.
  const have = new Set((s.chores || []).map(c => String(c.name || '').trim().toLowerCase()));
  for (const def of DEFAULT_CHORES) {
    const key = def.name.trim().toLowerCase();
    if (!have.has(key)) {
      s.chores.push({ id: uid('c'), name: def.name, amount: def.amount, emoji: def.emoji });
      have.add(key);
    }
  }
  s.choresDataVersion = CHORES_DATA_VERSION;
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function money(n){
  const v = Math.round((Number(n)||0)*100)/100;
  return (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(2);
}
function startOfWeek(d=new Date()){
  const x = new Date(d);
  const day = (x.getDay()+6)%7; // Mon=0
  x.setHours(0,0,0,0);
  x.setDate(x.getDate()-day);
  return x.getTime();
}
function fmtDate(ts){
  const d = new Date(ts);
  const opts = { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' };
  return d.toLocaleString(undefined, opts);
}
async function hashPin(pin){
  const data = new TextEncoder().encode('chore-pin:' + pin);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function selectedKid(){
  return state.kids.find(k => k.id === state.selectedKidId) || state.kids[0];
}
function balanceFor(kidId){
  return state.entries.filter(e => e.kidId === kidId).reduce((s,e) => s + (e.type==='payout' ? -Math.abs(e.amount) : e.amount), 0);
}
function weeklyFor(kidId){
  const start = startOfWeek();
  return state.entries.filter(e => e.kidId===kidId && e.type==='chore' && e.ts >= start)
    .reduce((s,e)=>s+e.amount,0);
}

function requireUnlock(action){
  if (unlocked || !state.pinHash) { action(); return; }
  pendingPinAction = action;
  openPinModal('Enter parent PIN');
}

/* ---------- Render ---------- */
function render(){
  const kid = selectedKid();
  if (!kid) {
    document.getElementById('balanceAmt').textContent = '$0.00';
    document.getElementById('choreList').innerHTML = '<div class="empty">Add a kid to get started</div>';
    document.getElementById('goalsList').innerHTML = '';
    document.getElementById('achievedList').innerHTML = '';
    document.getElementById('achievedWrap').classList.add('hidden');
    document.getElementById('historyList').innerHTML = '';
    renderKids();
    return;
  }
  state.selectedKidId = kid.id;
  const bal = balanceFor(kid.id);
  document.getElementById('balanceLabel').textContent = kid.name + "'s balance";
  document.getElementById('balanceAmt').textContent = money(bal);
  document.getElementById('balanceCard').style.background =
    `linear-gradient(145deg, ${kid.color}, ${shade(kid.color, -30)})`;
  document.getElementById('weeklyEarned').textContent = money(weeklyFor(kid.id));
  document.getElementById('btnUndo').disabled = !lastAction || lastAction.kidId !== kid.id;
  document.getElementById('lockBanner').classList.toggle('hidden', !state.pinHash || unlocked);
  renderKids();
  renderChores();
  renderGoals();
  renderHistory();
  saveState();
}
function shade(hex, pct){
  const n = hex.replace('#','');
  const num = parseInt(n.length===3 ? n.split('').map(c=>c+c).join('') : n, 16);
  let r=(num>>16)+pct, g=((num>>8)&0xff)+pct, b=(num&0xff)+pct;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function renderKids(){
  const el = document.getElementById('kidSwitcher');
  el.innerHTML = state.kids.map(k =>
    `<button class="kid-chip ${k.id===state.selectedKidId?'active':''}" data-kid="${k.id}"
      style="${k.id===state.selectedKidId?`background:${k.color}`:''}">${escapeHtml(k.name)}</button>`
  ).join('') + `<button class="kid-chip add" id="btnAddKid">+ Kid</button>`;
  el.querySelectorAll('[data-kid]').forEach(btn => btn.onclick = () => {
    state.selectedKidId = btn.dataset.kid; lastAction = null; render();
  });

function renderChores(){
  const el = document.getElementById('choreList');
  if (!state.chores.length) {
    el.innerHTML = '<div class="empty">No chores yet. Tap + Add.</div>';

  }
  el.innerHTML = state.chores.map(c => `
    <div class="chore-item" role="button" tabindex="0" data-chore="${c.id}">
      <div class="chore-emoji">${c.emoji||'⭐'}</div>
      <div class="chore-meta">
        <div class="chore-name">${escapeHtml(c.name)}</div>

    </div>`).join('');
  el.querySelectorAll('[data-chore]').forEach(row => {

function avgChoreAmount(){
  if (!state.chores.length) return 1;
  const sum = state.chores.reduce((s,c)=>s+Number(c.amount||0),0);
  return Math.max(0.25, sum / state.chores.length);
}
function renderGoals(){
  const kid = selectedKid();
  const el = document.getElementById('goalsList');
  const achEl = document.getElementById('achievedList');
  const wrap = document.getElementById('achievedWrap');
  if (!kid) { el.innerHTML=''; achEl.innerHTML=''; wrap.classList.add('hidden'); return; }
  const bal = balanceFor(kid.id);
  const active = (state.goals||[]).filter(g => g.kidId===kid.id && !g.achieved);
  const done = (state.goals||[]).filter(g => g.kidId===kid.id && g.achieved)
    .slice().sort((a,b)=>(b.achievedAt||0)-(a.achievedAt||0));
  if (!active.length) {
    el.innerHTML = '<div class="empty">No goals yet. Save up for something fun!</div>';
  } else {
    const avg = avgChoreAmount();
    el.innerHTML = active.map(g => {
      const price = Math.max(0.01, Number(g.price)||0);
      const pct = Math.min(100, Math.round((bal / price) * 1000) / 10);
      const saved = Math.min(bal, price);
      const toGo = Math.max(0, Math.round((price - bal)*100)/100);
      const ready = bal + 0.001 >= price;
      const choresLeft = ready ? 0 : Math.ceil(toGo / avg);
      return `<div class="goal-card ${ready?'ready':''}" data-goal="${g.id}">
        <div class="goal-top">
          <div class="goal-emoji">${g.emoji||'🎯'}</div>
          <div class="goal-info">
            <div class="goal-name">${escapeHtml(g.name)}</div>
            <div class="goal-meta">Goal ${money(price)}</div>
          </div>
          <div class="goal-actions">
            <button data-gedit="${g.id}" title="Edit" aria-label="Edit">✏️</button>
          </div>
        </div>
        <div class="goal-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
          <div class="goal-bar-fill" style="width:${pct}%"></div>
        </div>
        <div class="goal-progress-text">
          <span class="saved">${money(saved)} saved of ${money(price)}</span>
          <span class="togo">${ready ? 'Ready!' : money(toGo) + ' to go'}</span>
        </div>
        ${ready
          ? `<div class="goal-ready-badge">Ready! 🎉</div>
             <button class="goal-buy" data-gbuy="${g.id}">Mark as Bought</button>`
          : `<div class="goal-estimate">~${choresLeft} more chore${choresLeft===1?'':'s'} (avg ${money(avg)})</div>`}
      </div>`;
    }).join('');
  }
  if (done.length) {
    wrap.classList.remove('hidden');
    achEl.innerHTML = done.map(g => `
      <div class="goal-card achieved">
        <div class="goal-top">
          <div class="goal-emoji">${g.emoji||'🏆'}</div>
          <div class="goal-info">
            <div class="goal-name">${escapeHtml(g.name)}</div>
            <div class="goal-achieved-label">Bought for ${money(g.price)}${g.achievedAt? ' · '+fmtDate(g.achievedAt):''}</div>
          </div>
          <div class="goal-actions">
            <button data-gdel="${g.id}" title="Remove" aria-label="Remove">🗑️</button>
          </div>
        </div>
      </div>`).join('');
  } else {
    wrap.classList.add('hidden');
    achEl.innerHTML = '';
  }
  el.querySelectorAll('[data-gedit]').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); requireUnlock(() => openGoalModal(btn.dataset.gedit)); };
  });
  el.querySelectorAll('[data-gbuy]').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); requireUnlock(() => buyGoal(btn.dataset.gbuy)); };
  });
  achEl.querySelectorAll('[data-gdel]').forEach(btn => {
    btn.onclick = () => requireUnlock(() => {
      state.goals = state.goals.filter(g => g.id !== btn.dataset.gdel);
      render(); showToast('Removed from Achieved');
    });
  });
}
function openGoalModal(id){
  const kid = selectedKid();
  if (!kid) return;
  const g = id ? state.goals.find(x => x.id===id) : null;
  const isNew = !g;
  const phName = kid.name === 'Lev' ? 'Paw Patrol toy' : 'American Dream Mall trip';
  openModal(`
    <h2>${isNew?'Add goal':'Edit goal'}</h2>
    <div class="field"><label>Emoji</label><input id="gEmoji" maxlength="4" value="${escapeHtml(g?g.emoji||'🎯':'🎯')}"></div>
    <div class="field"><label>Name</label><input id="gName" value="${escapeHtml(g?g.name:'')}" placeholder="${escapeHtml(phName)}"></div>
    <div class="field"><label>Price ($)</label><input id="gPrice" type="number" min="0.01" step="0.25" value="${g?g.price:10}" inputmode="decimal"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">Cancel</button>
      ${!isNew?'<button class="btn btn-danger" id="mDel">Delete</button>':''}
      <button class="btn btn-primary" id="mSave" style="background:var(--primary);color:#fff">Save</button>
    </div>`);

    const price = Number(document.getElementById('gPrice').value);
    const emoji = document.getElementById('gEmoji').value.trim() || '🎯';
    if (!name) { showToast('Name required'); return; }

function buyGoal(id){
  const kid = selectedKid();
  const g = state.goals.find(x => x.id === id);
  if (!kid || !g || g.achieved) return;
  const price = Math.round(Number(g.price)*100)/100;
  const bal = balanceFor(kid.id);
  if (price > bal + 0.001) { showToast('Not enough saved yet'); return; }
  const entry = { id: uid('e'), kidId: kid.id, type: 'payout', name: 'Bought: ' + g.name,
    amount: price, ts: Date.now(), goalId: g.id };
  state.entries.push(entry);
  g.achieved = true;
  g.achievedAt = Date.now();
  lastAction = { type: 'add', kidId: kid.id, entryId: entry.id };
  render();
  showToast(`Bought ${g.emoji||'🎯'} ${g.name}!`, true);
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- Actions ---------- */
function logChore(choreId){
  const kid = selectedKid();
  if (!kid) return;
  const chore = state.chores.find(c => c.id === choreId);
  if (!chore) return;
  const entry = { id: uid('e'), kidId: kid.id, type: 'chore', choreId: chore.id,
    name: chore.name, amount: Number(chore.amount), ts: Date.now(), emoji: chore.emoji };
  state.entries.push(entry);
  lastAction = { type: 'add', kidId: kid.id, entryId: entry.id };
  render();
  showToast(`${chore.emoji||'⭐'} ${chore.name} +${money(chore.amount)}`, true);
}
function undoLast(){
  if (!lastAction) return;
  state.entries = state.entries.filter(e => e.id !== lastAction.entryId);
  lastAction = null;
  render();
  showToast('Undone');
}
function doPayout(amount){
  const kid = selectedKid();
  if (!kid) return;
  const bal = balanceFor(kid.id);
  const amt = Math.round(Number(amount)*100)/100;
  if (!(amt > 0)) { showToast('Enter a valid amount'); return; }
  if (amt > bal + 0.001) { showToast('Amount exceeds balance'); return; }
  const entry = { id: uid('e'), kidId: kid.id, type: 'payout', name: 'Payout', amount: amt, ts: Date.now() };
  state.entries.push(entry);
  lastAction = { type: 'add', kidId: kid.id, entryId: entry.id };
  closeModal();
  render();
  showToast(`Paid ${money(amt)}`, true);
}

/* ---------- Toast ---------- */
function showToast(msg, withUndo=false){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  const ub = document.getElementById('toastUndo');
  ub.classList.toggle('hidden', !withUndo);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}
document.getElementById('toastUndo').onclick = () => { undoLast(); document.getElementById('toast').classList.remove('show'); };

function openPinSetup(){
  openModal(`

    <p style="color:var(--muted);margin:0 0 12px;font-size:.95rem">Locks editing chores/kids, payouts, and imports. Kids can still log chores.</p>

    </div>

      <button class="btn btn-outline" id="mCancel">Cancel</button>

    </div>`);
  document.getElementById('mCancel').onclick = closeModal;

    if (!/^\d{4,8}$/.test(a)) { showToast('PIN must be 4–8 digits'); return; }
    if (a !== b) { showToast('PINs do not match'); return; }
    state.pinHash = await hashPin(a);

function openPinModal(title){
  let pin = '';
  openModal(`
    <h2>${escapeHtml(title)}</h2>
    <div class="pin-dots" id="pinDots">
      ${[0,1,2,3].map(()=>'<div class="pin-dot"></div>').join('')}
    </div>
    <div class="pin-pad">
      ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k =>
        k==='' ? '<div></div>' : `<button class="pin-key" data-k="${k}">${k}</button>`
      ).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-outline" id="mCancel">Cancel</button></div>`);
  const dots = () => {
    const ds = document.querySelectorAll('#pinDots .pin-dot');
    ds.forEach((d,i) => d.classList.toggle('filled', i < pin.length));
  };
  const trySubmit = async () => {
    if (pin.length < 4) return;
    const h = await hashPin(pin);
    if (h === state.pinHash) {
      unlocked = true;
      const act = pendingPinAction; pendingPinAction = null;
      closeModal(); render();
      if (act) act();
    } else {
      pin = ''; dots(); showToast('Wrong PIN');
    }
  };
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === '⌫') pin = pin.slice(0,-1);
    else if (pin.length < 8) pin += k;
    dots();
    if (pin.length >= 4) trySubmit();
  });
  document.getElementById('mCancel').onclick = () => { pendingPinAction=null; closeModal(); };
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `chore-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Backup downloaded');
  closeModal();
}
function openImport(){
  openModal(`
    <h2>Import backup</h2>
    <p style="color:var(--muted);font-size:.9rem">Paste JSON or choose a file. This replaces current data.</p>
    <div class="field"><label>Backup file</label><input type="file" id="impFile" accept="application/json,.json"></div>
    <div class="field"><label>Or paste JSON</label><textarea id="impText" placeholder='{"kids":...}'></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">Cancel</button>
      <button class="btn btn-danger" id="mImport">Import</button>
    </div>`);
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('impFile').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    document.getElementById('impText').value = await f.text();
  };
  document.getElementById('mImport').onclick = () => {
    try {
      const data = JSON.parse(document.getElementById('impText').value);
      if (!data.kids || !data.chores || !Array.isArray(data.entries)) throw new Error('Invalid backup');
      state = data;
      if (!Array.isArray(state.goals)) state.goals = [];
      if (state.choresDataVersion == null) state.choresDataVersion = 0;
      migrateChores(state);
      if (!state.selectedKidId && state.kids[0]) state.selectedKidId = state.kids[0].id;
      unlocked = !state.pinHash;
      lastAction = null;
      closeModal(); render(); showToast('Backup imported');
    } catch(err) { showToast('Invalid JSON backup'); }
  };
}

/* ---------- Tabs & events ---------- */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  const tab = t.dataset.tab;
  document.getElementById('tabChores').classList.toggle('hidden', tab !== 'chores');
  document.getElementById('tabHistory').classList.toggle('hidden', tab !== 'history');
});
document.getElementById('btnPayout').onclick = () => requireUnlock(openPayoutModal);
document.getElementById('btnUndo').onclick = undoLast;
document.getElementById('btnAddChore').onclick = () => requireUnlock(() => openChoreModal());
document.getElementById('btnAddGoal').onclick = () => requireUnlock(() => openGoalModal());
document.getElementById('btnMenu').onclick = openMenu;
document.getElementById('btnUnlock').onclick = () => { pendingPinAction = null; openPinModal('Enter parent PIN'); };
document.getElementById('btnClearHistory').onclick = () => requireUnlock(() => {
  const kid = selectedKid();
  if (!confirm(`Clear all history for ${kid.name}? Balance will reset.`)) return;
  state.entries = state.entries.filter(e => e.kidId !== kid.id);
  lastAction = null; render(); showToast('History cleared');
});

if ('serviceWorker' in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      if (reg) {
        reg.update().catch(()=>{});
        setInterval(() => reg.update().catch(()=>{}), 60 * 60 * 1000);
      }
    }).catch(()=>{});
  });
}

render();
</script>
</body>
</html>
