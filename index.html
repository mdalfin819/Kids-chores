<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chores">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Track kids' chores and allowance">
<title>Chore Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
:root {
  --bg: #F0F4FF;
  --card: #FFFFFF;
  --ink: #1E1B4B;
  --muted: #64748B;
  --primary: #4F46E5;
  --primary-dark: #3730A3;
  --accent: #10B981;
  --warn: #F59E0B;
  --danger: #EF4444;
  --reuven: #6366F1;
  --lev: #EC4899;
  --shadow: 0 4px 20px rgba(79,70,229,.12);
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100%; }
body { padding-top: var(--safe-t); padding-bottom: calc(20px + var(--safe-b)); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: none; background: none; }
.app { max-width: 480px; margin: 0 auto; padding: 12px 14px 40px; }
.header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.25rem; letter-spacing: -.02em; }
.logo-badge { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg,#4F46E5,#818CF8);
  display: grid; place-items: center; color: #fff; font-size: 1.1rem; box-shadow: var(--shadow); }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow);
  display: grid; place-items: center; font-size: 1.15rem; color: var(--ink); }
.icon-btn:active { transform: scale(.96); }
.kid-switcher { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.kid-switcher::-webkit-scrollbar { display: none; }
.kid-chip { flex: 0 0 auto; min-width: 100px; padding: 12px 16px; border-radius: 999px; background: var(--card);
  box-shadow: var(--shadow); font-weight: 700; font-size: 1rem; color: var(--muted); border: 2px solid transparent;
  transition: .15s; }
.kid-chip.active { color: #fff; border-color: transparent; }
.kid-chip.add { border: 2px dashed #C7D2FE; color: var(--primary); background: #EEF2FF; box-shadow: none; }
.balance-card { background: linear-gradient(145deg, var(--primary), #7C3AED); color: #fff; border-radius: 24px;
  padding: 22px 20px 18px; box-shadow: 0 10px 30px rgba(79,70,229,.35); margin-bottom: 16px; position: relative; overflow: hidden; }
.balance-card::after { content: ''; position: absolute; right: -30px; top: -30px; width: 140px; height: 140px;
  border-radius: 50%; background: rgba(255,255,255,.1); }
.balance-label { font-size: .9rem; opacity: .9; font-weight: 600; }
.balance-amt { font-size: 3rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin: 4px 0 12px; }
.balance-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 12px 18px;
  border-radius: 14px; font-weight: 700; font-size: 1rem; transition: .12s; }
.btn:active { transform: scale(.97); }
.btn-primary { background: #fff; color: var(--primary); }
.btn-ghost { background: rgba(255,255,255,.2); color: #fff; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-outline { background: var(--card); color: var(--ink); border: 2px solid #E2E8F0; }
.btn-block { width: 100%; }
.section { margin-bottom: 18px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.section-title { font-size: 1.05rem; font-weight: 800; margin: 0; }
.linkish { color: var(--primary); font-weight: 700; font-size: .9rem; padding: 8px; }
.chore-grid { display: grid; gap: 10px; }
.chore-item { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: var(--radius);
  padding: 14px 14px 14px 16px; box-shadow: var(--shadow); min-height: 64px; text-align: left; width: 100%; }
.chore-item:active { transform: scale(.985); background: #EEF2FF; }
.chore-emoji { font-size: 1.6rem; width: 44px; height: 44px; border-radius: 12px; background: #EEF2FF;
  display: grid; place-items: center; flex-shrink: 0; }
.chore-meta { flex: 1; min-width: 0; }
.chore-name { font-weight: 700; font-size: 1.05rem; }
.chore-pay { color: var(--accent); font-weight: 800; font-size: 1.05rem; }
.chore-edit { width: 40px; height: 40px; border-radius: 12px; color: var(--muted); font-size: 1.1rem; }
.weekly { background: var(--card); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
  display: flex; justify-content: space-between; align-items: center; }
.weekly strong { color: var(--accent); font-size: 1.2rem; }
.history { display: flex; flex-direction: column; gap: 8px; }
.hist-item { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px;
  padding: 12px 12px 12px 14px; box-shadow: 0 2px 10px rgba(15,23,42,.05); }
.hist-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.hist-dot.earn { background: var(--accent); }
.hist-dot.pay { background: var(--warn); }
.hist-body { flex: 1; min-width: 0; }
.hist-title { font-weight: 700; font-size: .95rem; }
.hist-date { color: var(--muted); font-size: .8rem; }
.hist-amt { font-weight: 800; white-space: nowrap; }
.hist-amt.earn { color: var(--accent); }
.hist-amt.pay { color: var(--warn); }
.hist-del { width: 40px; height: 40px; border-radius: 10px; color: var(--danger); font-size: 1rem; }
.empty { text-align: center; color: var(--muted); padding: 24px 12px; font-size: .95rem; }
.toast { position: fixed; left: 50%; bottom: calc(24px + var(--safe-b)); transform: translateX(-50%) translateY(120%);
  background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 700; font-size: .95rem;
  z-index: 100; transition: transform .25s ease; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 90vw;
  display: flex; align-items: center; gap: 12px; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast button { color: #A5B4FC; font-weight: 800; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 200; display: none;
  align-items: flex-end; justify-content: center; padding: 12px; padding-bottom: calc(12px + var(--safe-b)); }
.modal-backdrop.open { display: flex; }
.modal { background: #fff; width: 100%; max-width: 480px; border-radius: 24px 24px 20px 20px; padding: 20px 18px 16px;
  max-height: 90vh; overflow: auto; box-shadow: 0 -10px 40px rgba(0,0,0,.2); }
.modal h2 { margin: 0 0 14px; font-size: 1.25rem; }
.field { margin-bottom: 12px; }
.field label { display: block; font-weight: 700; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
.field input, .field select, .field textarea { width: 100%; min-height: 48px; padding: 12px 14px; border-radius: 14px;
  border: 2px solid #E2E8F0; background: #F8FAFC; font-size: 1.05rem; outline: none; }
.field input:focus, .field textarea:focus { border-color: var(--primary); background: #fff; }
.field textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
.modal-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.modal-actions .btn { flex: 1; min-width: 120px; }
.pin-dots { display: flex; gap: 12px; justify-content: center; margin: 12px 0 18px; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #C7D2FE; background: transparent; }
.pin-dot.filled { background: var(--primary); border-color: var(--primary); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 280px; margin: 0 auto 12px; }
.pin-key { min-height: 56px; border-radius: 16px; background: #EEF2FF; font-size: 1.4rem; font-weight: 800; color: var(--ink); }
.pin-key:active { background: #C7D2FE; }
.lock-banner { background: #FEF3C7; color: #92400E; border-radius: 14px; padding: 10px 14px; font-weight: 700;
  font-size: .9rem; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tabs { display: flex; gap: 6px; background: #E0E7FF; padding: 4px; border-radius: 14px; margin-bottom: 14px; }
.tab { flex: 1; min-height: 42px; border-radius: 11px; font-weight: 700; color: var(--muted); }
.tab.active { background: #fff; color: var(--primary); box-shadow: 0 2px 8px rgba(79,70,229,.15); }
.quick-amts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { min-height: 42px; padding: 8px 14px; border-radius: 999px; background: #EEF2FF; color: var(--primary); font-weight: 700; }
.chip.active { background: var(--primary); color: #fff; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

.goals-section { margin-bottom: 18px; }
.goal-card { background: var(--card); border-radius: var(--radius); padding: 14px 14px 12px;
  box-shadow: var(--shadow); margin-bottom: 10px; }
.goal-card.ready { background: linear-gradient(135deg, #ECFDF5, #D1FAE5); border: 2px solid #34D399; }
.goal-card.achieved { opacity: .85; }
.goal-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.goal-emoji { font-size: 1.7rem; width: 48px; height: 48px; border-radius: 14px; background: #EEF2FF;
  display: grid; place-items: center; flex-shrink: 0; }
.goal-card.ready .goal-emoji { background: #A7F3D0; }
.goal-info { flex: 1; min-width: 0; }
.goal-name { font-weight: 800; font-size: 1.05rem; }
.goal-meta { color: var(--muted); font-size: .85rem; font-weight: 600; margin-top: 2px; }
.goal-actions { display: flex; gap: 4px; flex-shrink: 0; }
.goal-actions button { width: 40px; height: 40px; border-radius: 12px; font-size: 1.05rem; color: var(--muted); }
.goal-bar { height: 18px; background: #E0E7FF; border-radius: 999px; overflow: hidden; margin: 8px 0 8px; }
.goal-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6366F1, #A78BFA);
  transition: width .35s ease; min-width: 0; }
.goal-card.ready .goal-bar-fill { background: linear-gradient(90deg, #10B981, #34D399); }
.goal-progress-text { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  font-size: .9rem; font-weight: 700; }
.goal-progress-text .saved { color: var(--accent); }
.goal-progress-text .togo { color: var(--muted); }
.goal-estimate { font-size: .82rem; color: var(--muted); margin-top: 6px; font-weight: 600; }
.goal-ready-badge { display: inline-flex; align-items: center; gap: 4px; background: #10B981; color: #fff;
  font-weight: 800; font-size: .85rem; padding: 6px 12px; border-radius: 999px; margin-top: 8px; }
.goal-buy { margin-top: 10px; width: 100%; min-height: 44px; border-radius: 12px; background: var(--accent);
  color: #fff; font-weight: 800; }
.goal-achieved-label { font-size: .85rem; color: var(--muted); font-weight: 700; margin-top: 4px; }

.cat-section { margin-bottom: 10px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.cat-header { width: 100%; display: flex; align-items: center; gap: 10px; padding: 14px 14px; text-align: left;
  font-weight: 800; font-size: 1.05rem; color: var(--ink); background: transparent; }
.cat-header:active { background: #EEF2FF; }
.cat-emoji { font-size: 1.35rem; width: 36px; text-align: center; }
.cat-title { flex: 1; }
.cat-count { color: var(--muted); font-size: .85rem; font-weight: 700; }
.cat-chevron { color: var(--muted); font-size: 1.1rem; transition: transform .2s; }
.cat-section.collapsed .cat-chevron { transform: rotate(-90deg); }
.cat-section.collapsed .cat-body { display: none; }
.cat-body { display: grid; gap: 8px; padding: 0 10px 12px; }
.cat-body .chore-item { box-shadow: 0 2px 8px rgba(15,23,42,.06); }
.cat-picker { display: flex; flex-wrap: wrap; gap: 8px; }
.cat-pick { min-height: 42px; padding: 8px 12px; border-radius: 999px; background: #EEF2FF; color: var(--primary);
  font-weight: 700; font-size: .9rem; border: 2px solid transparent; }
.cat-pick.active { background: var(--primary); color: #fff; border-color: var(--primary-dark); }

.icon-btn.spinning { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ptr-indicator { position: fixed; top: calc(8px + var(--safe-t)); left: 50%; transform: translateX(-50%) translateY(-80px);
  background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: .9rem;
  z-index: 150; opacity: 0; transition: transform .2s, opacity .2s; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.ptr-indicator.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.today-bar { background: var(--card); border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow);
  display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.today-bar strong { color: var(--primary); font-size: 1.05rem; }
.chore-item.done-today { background: #ECFDF5; border: 2px solid #6EE7B7; }
.chore-item.done-today .chore-emoji { background: #A7F3D0; }
.chore-check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #C7D2FE; display: grid; place-items: center;
  flex-shrink: 0; font-size: .95rem; color: transparent; background: #fff; }
.chore-item.done-today .chore-check { background: #10B981; border-color: #059669; color: #fff; font-weight: 800; }
.chore-count-badge { min-width: 28px; height: 28px; padding: 0 8px; border-radius: 999px; background: #10B981; color: #fff;
  font-weight: 800; font-size: .85rem; display: grid; place-items: center; flex-shrink: 0; }
.chore-done-label { color: #059669; font-size: .78rem; font-weight: 800; margin-top: 2px; }
.cat-progress { color: var(--muted); font-size: .82rem; font-weight: 700; white-space: nowrap; }
.field-check { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 0; }
.field-check input { width: 22px; height: 22px; accent-color: var(--primary); }

.emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.emoji-pick { width: 44px; height: 44px; border-radius: 12px; background: #EEF2FF; font-size: 1.4rem;
  display: grid; place-items: center; }
.emoji-pick:active, .emoji-pick.active { background: var(--primary); transform: scale(.96); }
.goal-photo-wrap { position: relative; width: 100%; height: 180px; border-radius: 16px; overflow: hidden;
  margin-bottom: 12px; background: #E0E7FF; }
.goal-photo { width: 100%; height: 100%; object-fit: cover; display: block;
  transition: filter .45s ease, opacity .45s ease; cursor: zoom-in; }
.goal-photo-fallback { width: 100%; height: 100%; display: grid; place-items: center; font-size: 4rem; background: #EEF2FF; }
.goal-bar-fill { transition: width .55s cubic-bezier(.2,.8,.2,1); }
.goal-confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.goal-confetti i { position: absolute; top: -10px; width: 8px; height: 8px; border-radius: 2px;
  animation: confetti-fall 1.4s ease-in forwards; opacity: .95; }
@keyframes confetti-fall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(200px) rotate(420deg); opacity: 0; }
}
.lightbox { position: fixed; inset: 0; background: rgba(15,23,42,.92); z-index: 300; display: none;
  align-items: center; justify-content: center; padding: 16px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 90vh; border-radius: 16px; object-fit: contain; }
.lightbox-close { position: absolute; top: calc(12px + var(--safe-t)); right: 16px; width: 44px; height: 44px;
  border-radius: 14px; background: rgba(255,255,255,.15); color: #fff; font-size: 1.4rem; font-weight: 800; }
.photo-preview { width: 100%; height: 140px; border-radius: 14px; object-fit: cover; background: #EEF2FF; margin-top: 8px; }
.photo-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.photo-actions .btn { flex: 1; min-width: 120px; min-height: 44px; }

.goals-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 520px) { .goals-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.goal-tile { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 8px;
  text-align: left; width: 100%; display: flex; flex-direction: column; gap: 6px; min-height: 0;
  border: 2px solid transparent; }
.goal-tile.ready { border-color: #34D399; background: linear-gradient(135deg, #ECFDF5, #D1FAE5); }
.goal-tile-thumb { width: 100%; aspect-ratio: 1 / 1; max-height: 120px; border-radius: 12px; overflow: hidden;
  background: #EEF2FF; display: grid; place-items: center; position: relative; }
.goal-tile-thumb img { width: 100%; height: 100%; object-fit: cover; display: block;
  transition: filter .45s ease, opacity .45s ease; }
.goal-tile-emoji { font-size: 2.4rem; }
.goal-tile-name { font-weight: 800; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.goal-tile-bar { height: 8px; background: #E0E7FF; border-radius: 999px; overflow: hidden; }
.goal-tile-bar > span { display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, #6366F1, #A78BFA); transition: width .55s cubic-bezier(.2,.8,.2,1); }
.goal-tile.ready .goal-tile-bar > span { background: linear-gradient(90deg, #10B981, #34D399); }
.goal-tile-togo { font-size: .78rem; font-weight: 800; color: var(--muted); }
.goal-tile.ready .goal-tile-togo { color: #059669; }
.goal-tile-add { border: 2px dashed #C7D2FE; background: #EEF2FF; box-shadow: none; color: var(--primary);
  font-weight: 800; min-height: 140px; align-items: center; justify-content: center; font-size: 1rem; gap: 4px; }
.goal-tile-add:active { transform: scale(.98); }
.achieved-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 520px) { .achieved-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.goal-tile.achieved { opacity: .9; }
.goal-tile.achieved .goal-tile-togo { color: var(--muted); font-weight: 700; }
.file-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0; opacity: 0; }
.photo-actions label.btn { position: relative; overflow: hidden; }
.detail-photo { width: 100%; height: 200px; border-radius: 16px; object-fit: cover; background: #EEF2FF; margin-bottom: 12px; }
.detail-photo-fallback { width: 100%; height: 160px; border-radius: 16px; background: #EEF2FF;
  display: grid; place-items: center; font-size: 4rem; margin-bottom: 12px; }

.week-bar { background: var(--card); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow);
  display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.week-bar strong { color: var(--primary); font-size: 1.05rem; }
.week-nav { display: flex; gap: 6px; align-items: center; }
.week-nav button { min-height: 36px; padding: 6px 10px; border-radius: 10px; background: #EEF2FF; color: var(--primary);
  font-weight: 800; font-size: .82rem; }
.week-nav button:disabled { opacity: .4; }
.day-dots { display: flex; gap: 4px; margin-top: 6px; justify-content: flex-start; flex-wrap: nowrap; }
.day-dot { width: 28px; height: 28px; min-width: 28px; min-height: 28px; padding: 0; border-radius: 50%;
  border: 2px solid #C7D2FE; background: #fff; color: var(--muted); font-size: .62rem; font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center; line-height: 1; position: relative;
  /* expand hit area without growing visual */
  box-shadow: 0 0 0 6px transparent; }
.day-dot:active:not(:disabled) { transform: scale(.94); }
.day-dot.today { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 2px rgba(79,70,229,.2); }
.day-dot.filled { background: #10B981; border-color: #059669; color: #fff; }
.day-dot.filled.today { box-shadow: 0 0 0 2px rgba(16,185,129,.35); }
.day-dot:disabled { opacity: .35; background: #F1F5F9; border-color: #E2E8F0; color: #94A3B8; }
.day-dot .dot-count { position: absolute; top: -6px; right: -6px; min-width: 14px; height: 14px; padding: 0 3px;
  border-radius: 999px; background: var(--primary); color: #fff; font-size: .55rem; font-weight: 800;
  display: grid; place-items: center; }
.chore-item { flex-wrap: wrap; align-items: flex-start; }
.chore-item .chore-meta { flex: 1; min-width: 120px; }
.chore-item .day-dots { width: 100%; padding-left: 56px; /* align under meta past emoji */ }
.chore-item.done-week { background: #F0FDF4; }
.chore-check, .chore-count-badge, .chore-done-label { display: none !important; } /* replaced by day dots */
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="logo"><div class="logo-badge">✨</div><span>Chore Tracker</span></div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="btnRefresh" title="Refresh app" aria-label="Refresh app">↻</button>
      <button class="icon-btn" id="btnMenu" title="Menu" aria-label="Menu">☰</button>
    </div>
  </div>

  <div id="lockBanner" class="lock-banner hidden">
    <span>🔒 Editing locked</span>
    <button class="linkish" id="btnUnlock" style="color:#92400E">Unlock</button>
  </div>

  <div class="kid-switcher" id="kidSwitcher"></div>

  <div class="balance-card" id="balanceCard">
    <div class="balance-label" id="balanceLabel">Balance</div>
    <div class="balance-amt" id="balanceAmt">$0.00</div>
    <div class="balance-actions">
      <button class="btn btn-primary" id="btnPayout">💵 Pay out</button>
      <button class="btn btn-ghost" id="btnUndo" disabled>↩ Undo</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="chores">Chores</button>
    <button class="tab" data-tab="history">History</button>
  </div>

  <div id="tabChores">
    <div class="section">
      <div class="week-bar" id="todayBar">
        <div>
          <div id="weekLabel" style="font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:2px">This week</div>
          <span><strong id="todayProgress">0 chores</strong> · <strong id="todayEarned">$0.00 earned</strong></span>
        </div>
        <div class="week-nav">
          <button type="button" id="btnPrevWeek" title="Last week">‹ Last week</button>
          <button type="button" id="btnThisWeek" class="hidden" title="This week">This week ›</button>
        </div>
      </div>
      <div class="weekly">
        <span>This week earned</span>
        <strong id="weeklyEarned">$0.00</strong>
      </div>
    </div>
    <div class="section goals-section">
      <div class="section-head">
        <h2 class="section-title">🎯 Goals</h2>
        <button class="linkish" id="btnAddGoal">+ Add</button>
      </div>
      <div id="goalsList"></div>
      <div id="achievedWrap" class="hidden" style="margin-top:14px">
        <div class="section-head">
          <h2 class="section-title" style="font-size:.95rem;color:var(--muted)">Achieved</h2>
        </div>
        <div id="achievedList"></div>
      </div>
    </div>
    <div class="section">
      <div class="section-head">
        <h2 class="section-title">Tap a chore</h2>
        <button class="linkish" id="btnAddChore">+ Add</button>
      </div>
      <div class="chore-grid" id="choreList"></div>
    </div>
  </div>

  <div id="tabHistory" class="hidden">
    <div class="section">
      <div class="section-head">
        <h2 class="section-title">History</h2>
        <button class="linkish" id="btnClearHistory" style="color:var(--danger)">Clear</button>
      </div>
      <div class="history" id="historyList"></div>
    </div>
  </div>
</div>

<div class="ptr-indicator" id="ptrIndicator">↓ Refresh</div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true"><button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button><img id="lightboxImg" alt="Goal photo"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" class="hidden">Undo</button></div>

<div class="modal-backdrop" id="modal">
  <div class="modal" id="modalBody" role="dialog" aria-modal="true"></div>
</div>

<script>
const STORAGE_KEY = 'chore-tracker-v1';
const CHORES_DATA_VERSION = 5;
const CATEGORIES = [
  { id: 'morning', name: 'Morning', emoji: '☀️' },
  { id: 'afterschool', name: 'After School', emoji: '🎒' },
  { id: 'evening', name: 'Evening', emoji: '🌙' },
  { id: 'general', name: 'General', emoji: '🏠' },
  { id: 'erevshabbos', name: 'Erev Shabbos', emoji: '🕯️' },
];
const DEFAULT_CHORES = [
  { id: 'c1', name: 'Make bed', amount: 0.5, emoji: '🛏️', category: 'morning' },
  { id: 'c13', name: 'Brush teeth morning & night', amount: 0.25, emoji: '🪥', category: 'morning' },
  { id: 'c14', name: 'Get dressed & ready on time', amount: 0.5, emoji: '👔', category: 'morning' },
  { id: 'c8', name: 'Homework right after school', amount: 1, emoji: '📚', category: 'afterschool' },
  { id: 'c12', name: 'Put shoes & backpack away', amount: 0.25, emoji: '🎒', category: 'afterschool' },
  { id: 'c16', name: 'Read 20 minutes', amount: 0.5, emoji: '📖', category: 'afterschool' },
  { id: 'c4', name: 'Set table', amount: 0.5, emoji: '🍽️', category: 'evening' },
  { id: 'c11', name: 'Clear table after dinner', amount: 0.5, emoji: '🍽️', category: 'evening' },
  { id: 'c10', name: 'Slept in own bed', amount: 0.5, emoji: '😴', category: 'evening' },
  { id: 'c15', name: 'Help unload dishwasher', amount: 0.5, emoji: '🍽️', category: 'evening' },
  { id: 'c2', name: 'Take out trash', amount: 1, emoji: '🗑️', category: 'general' },
  { id: 'c7', name: 'Take out recycling', amount: 0.5, emoji: '♻️', category: 'general' },
  { id: 'c3', name: 'Clean room', amount: 1.5, emoji: '🧹', category: 'general' },
  { id: 'c9', name: 'Clean up toys', amount: 0.5, emoji: '🪀', category: 'general' },
  { id: 'c5', name: 'Put away toys', amount: 0.5, emoji: '🧸', category: 'general' },
  { id: 'c6', name: 'Laundry (fold & put away)', amount: 1, emoji: '👕', category: 'general' },
  { id: 'c17', name: 'Off the iPad without whining', amount: 0.5, emoji: '📱', category: 'general' },
  { id: 'c18', name: 'Set the Shabbos table', amount: 1, emoji: '🕯️', category: 'erevshabbos' },
  { id: 'c19', name: 'Set out plates & cutlery', amount: 0.5, emoji: '🍴', category: 'erevshabbos' },
  { id: 'c20', name: "Set up Mommy's candles", amount: 0.5, emoji: '🕎', category: 'erevshabbos' },
  { id: 'c21', name: 'Shower & ready on time for Shabbos', amount: 1, emoji: '🚿', category: 'erevshabbos' },
];
const CATEGORY_BY_NAME = Object.fromEntries(
  DEFAULT_CHORES.map(c => [c.name.trim().toLowerCase(), c.category])
);
const DEFAULT_KIDS = [
  { id: 'k1', name: 'Reuven', color: '#6366F1' },
  { id: 'k2', name: 'Lev', color: '#EC4899' },
];
const COLORS = ['#6366F1','#EC4899','#10B981','#F59E0B','#06B6D4','#8B5CF6','#EF4444','#14B8A6'];

let state = loadState();
let lastAction = null; // { type, kidId, entryId, prevBalance }
let toastTimer = null;
let unlocked = !state.pinHash; // if no pin, always unlocked for editing
let pendingPinAction = null;

function uid(prefix){ return prefix + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (!s.kids || !s.chores || !s.entries) throw new Error('bad');
      if (!Array.isArray(s.goals)) s.goals = [];
      if (!s.collapsedCategories || typeof s.collapsedCategories !== 'object') s.collapsedCategories = {};
      migrateChores(s);
      return s;
    }
  } catch(e){}
  return {
    kids: DEFAULT_KIDS.map(k => ({...k})),
    chores: DEFAULT_CHORES.map(c => ({...c})),
    entries: [], // {id, kidId, type:'chore'|'payout', choreId?, name, amount, ts}
    goals: [], // {id, kidId, name, price, emoji, achieved, achievedAt?}
    selectedKidId: DEFAULT_KIDS[0].id,
    pinHash: null,
    choresDataVersion: CHORES_DATA_VERSION,
    collapsedCategories: {},
  };
}
function migrateChores(s){
  const ver = Number(s.choresDataVersion) || 0;
  // Always normalize missing category fields (never re-add deleted chores here).
  for (const c of (s.chores || [])) {
    if (!c.category) c.category = CATEGORY_BY_NAME[String(c.name||'').trim().toLowerCase()] || 'general';
  }
  if (!s.collapsedCategories || typeof s.collapsedCategories !== 'object') s.collapsedCategories = {};
  if (!Array.isArray(s.goals)) s.goals = [];
  if (ver >= CHORES_DATA_VERSION) return;

  // Halve existing chore amounts first (v5). Never touch history, balances, goals, or payouts.
  // Newly seeded defaults below already use the new (halved) amounts, so they are added after this.
  if (ver < 5) {
    for (const c of (s.chores || [])) {
      const amt = Number(c.amount);
      if (Number.isFinite(amt)) c.amount = Math.round(amt * 100 / 2) / 100;
    }
  }

  // Seed default chores only when upgrading from before the last chore-list version (3).
  // Later bumps must NOT re-add chores the parent deleted.
  if (ver < 3) {
    const have = new Set((s.chores || []).map(c => String(c.name || '').trim().toLowerCase()));
    for (const def of DEFAULT_CHORES) {
      const key = def.name.trim().toLowerCase();
      if (!have.has(key)) {
        s.chores.push({ id: uid('c'), name: def.name, amount: def.amount, emoji: def.emoji, category: def.category });
        have.add(key);
      }
    }
  }
  s.choresDataVersion = CHORES_DATA_VERSION;
}
function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    const quota = err && (err.name === 'QuotaExceededError' || err.code === 22 || err.code === 1014);
    if (quota) {
      showToast('Storage full — try a smaller photo or remove old ones');
      throw err;
    }
    throw err;
  }
}

function money(n){
  const v = Math.round((Number(n)||0)*100)/100;
  return (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(2);
}
function startOfWeek(d=new Date()){
  // Sunday 00:00 local → Saturday end (week resets Sunday)
  const x = new Date(d);
  x.setHours(0,0,0,0);
  x.setDate(x.getDate() - x.getDay()); // Sun=0
  return x.getTime();
}
function endOfWeek(d=new Date()){
  const x = new Date(startOfWeek(d));
  x.setDate(x.getDate() + 6);
  x.setHours(23,59,59,999);
  return x.getTime();
}
function fmtDate(ts){
  const d = new Date(ts);
  const opts = { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' };
  return d.toLocaleString(undefined, opts);
}
async function hashPin(pin){
  const data = new TextEncoder().encode('chore-pin:' + pin);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function selectedKid(){
  return state.kids.find(k => k.id === state.selectedKidId) || state.kids[0];
}
function balanceFor(kidId){
  return state.entries.filter(e => e.kidId === kidId).reduce((s,e) => s + (e.type==='payout' ? -Math.abs(e.amount) : e.amount), 0);
}
function weeklyFor(kidId){
  const start = startOfWeek();
  return state.entries.filter(e => e.kidId===kidId && e.type==='chore' && e.ts >= start)
    .reduce((s,e)=>s+e.amount,0);
}

function requireUnlock(action){
  if (unlocked || !state.pinHash) { action(); return; }
  pendingPinAction = action;
  openPinModal('Enter parent PIN');
}

/* ---------- Render ---------- */
function render(){
  const kid = selectedKid();
  if (!kid) {
    document.getElementById('balanceAmt').textContent = '$0.00';
    document.getElementById('choreList').innerHTML = '<div class="empty">Add a kid to get started</div>';
    document.getElementById('goalsList').innerHTML = '';
    document.getElementById('achievedList').innerHTML = '';
    document.getElementById('achievedWrap').classList.add('hidden');
    document.getElementById('historyList').innerHTML = '';
    renderKids();
    return;
  }
  state.selectedKidId = kid.id;
  const bal = balanceFor(kid.id);
  document.getElementById('balanceLabel').textContent = kid.name + "'s balance";
  document.getElementById('balanceAmt').textContent = money(bal);
  document.getElementById('balanceCard').style.background =
    `linear-gradient(145deg, ${kid.color}, ${shade(kid.color, -30)})`;
  document.getElementById('weeklyEarned').textContent = money(weeklyFor(kid.id));
  document.getElementById('btnUndo').disabled = !lastAction || lastAction.kidId !== kid.id;
  document.getElementById('lockBanner').classList.toggle('hidden', !state.pinHash || unlocked);
  renderKids();
  renderChores();
  renderGoals();
  renderHistory();
  saveState();
}
function shade(hex, pct){
  const n = hex.replace('#','');
  const num = parseInt(n.length===3 ? n.split('').map(c=>c+c).join('') : n, 16);
  let r=(num>>16)+pct, g=((num>>8)&0xff)+pct, b=(num&0xff)+pct;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function renderKids(){
  const el = document.getElementById('kidSwitcher');
  el.innerHTML = state.kids.map(k =>
    `<button class="kid-chip ${k.id===state.selectedKidId?'active':''}" data-kid="${k.id}"
      style="${k.id===state.selectedKidId?`background:${k.color}`:''}">${escapeHtml(k.name)}</button>`
  ).join('') + `<button class="kid-chip add" id="btnAddKid">+ Kid</button>`;
  el.querySelectorAll('[data-kid]').forEach(btn => btn.onclick = () => {
    state.selectedKidId = btn.dataset.kid; lastAction = null; render();
  });
  document.getElementById('btnAddKid').onclick = () => requireUnlock(() => openKidModal());
}
function suggestedCategoryId(){
  const now = new Date();
  const day = now.getDay(); // 0 Sun .. 5 Fri
  const hour = now.getHours();
  if (day === 5) return 'erevshabbos'; // Friday → Erev Shabbos
  if (hour < 12) return 'morning';
  if (hour < 17) return 'afterschool';
  return 'evening';
}
function isCategoryCollapsed(catId){
  if (!state.collapsedCategories) state.collapsedCategories = {};
  if (Object.prototype.hasOwnProperty.call(state.collapsedCategories, catId)) {
    return !!state.collapsedCategories[catId];
  }
  // Default: expand suggested time-of-day section; collapse others
  return catId !== suggestedCategoryId();
}
function toggleCategory(catId){
  if (!state.collapsedCategories) state.collapsedCategories = {};
  state.collapsedCategories[catId] = !isCategoryCollapsed(catId);
  saveState();
  renderChores();
}

let weekOffset = 0; // 0 = current Sun–Sat week, -1 = previous week

function localDateKey(ts = Date.now()){
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dateFromKey(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d, 12, 0, 0, 0); // noon local avoids DST edge
  return dt;
}
function viewedWeekStart(){
  const base = new Date(startOfWeek());
  base.setDate(base.getDate() + (weekOffset * 7));
  return base.getTime();
}
function weekDayKeys(offset = weekOffset){
  const start = new Date(startOfWeek());
  start.setDate(start.getDate() + (offset * 7));
  const keys = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    keys.push(localDateKey(d.getTime()));
  }
  return keys; // Sun..Sat
}
function choreEntriesOnDate(kidId, choreId, dateKey){
  return state.entries.filter(e =>
    e.kidId === kidId && e.type === 'chore' && e.choreId === choreId && localDateKey(e.ts) === dateKey
  );
}
function todaysChoreEntries(kidId, choreId){
  return choreEntriesOnDate(kidId, choreId, localDateKey());
}
function weekStats(kidId){
  const keys = new Set(weekDayKeys());
  const weekEntries = state.entries.filter(e =>
    e.kidId === kidId && e.type === 'chore' && keys.has(localDateKey(e.ts))
  );
  const earned = weekEntries.reduce((s,e)=>s+Number(e.amount||0), 0);
  let done = 0;
  for (const c of state.chores) {
    if (weekEntries.some(e => e.choreId === c.id)) done++;
  }
  return { done, total: state.chores.length, earned, count: weekEntries.length, weekEntries };
}
function todayStats(kidId){ // kept as alias for any leftover callers
  return weekStats(kidId);
}
function fmtWeekRange(){
  const keys = weekDayKeys();
  const a = dateFromKey(keys[0]);
  const b = dateFromKey(keys[6]);
  const opts = { month:'short', day:'numeric' };
  return a.toLocaleDateString(undefined, opts) + ' – ' + b.toLocaleDateString(undefined, opts);
}


function choreItemHtml(c, kidId){
  const keys = weekDayKeys();
  const todayKey = localDateKey();
  const labels = ['S','M','T','W','T','F','S'];
  const erevOnly = c.category === 'erevshabbos';
  const multi = !!c.allowMultiple;
  let anyThisWeek = false;
  const dots = keys.map((key, i) => {
    if (erevOnly && i !== 5) return ''; // Friday only for Erev Shabbos
    const entries = choreEntriesOnDate(kidId, c.id, key);
    const count = entries.length;
    if (count) anyThisWeek = true;
    const isToday = key === todayKey;
    const isFuture = dateFromKey(key).setHours(0,0,0,0) > new Date().setHours(0,0,0,0);
    const filled = count > 0;
    const disabled = isFuture ? 'disabled' : '';
    const cls = ['day-dot', isToday?'today':'', filled?'filled':''].filter(Boolean).join(' ');
    const title = `${labels[i]} ${key}${filled ? ' · done'+(multi && count>1?' ×'+count:'') : ''}${isFuture?' (future)':''}`;
    const countBadge = (multi && count > 1) ? `<span class="dot-count">${count}</span>` : (multi && count===1 ? `<span class="dot-count">1</span>` : '');
    return `<button type="button" class="${cls}" data-day-chore="${c.id}" data-day-key="${key}"
      ${disabled} title="${escapeHtml(title)}" aria-label="${escapeHtml(title)}">${labels[i]}${countBadge}</button>`;
  }).join('');

  return `<div class="chore-item ${anyThisWeek?'done-week':''}" role="button" tabindex="0" data-chore="${c.id}">
      <div class="chore-emoji">${c.emoji||'⭐'}</div>
      <div class="chore-meta">
        <div class="chore-name">${escapeHtml(c.name)}</div>
        <div class="chore-pay">${money(c.amount)}</div>
      </div>
      <button class="chore-edit" data-edit="${c.id}" title="Edit" aria-label="Edit">✏️</button>
      <div class="day-dots" data-dots-for="${c.id}">${dots}</div>
    </div>`;
}
function bindChoreRows(root){
  root.querySelectorAll('[data-chore]').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('[data-edit]')) return;
      if (e.target.closest('[data-day-chore]')) return; // handled by day dots
      const id = row.dataset.chore;
      const chore = state.chores.find(c => c.id === id);
      if (!chore) return;
      const kid = selectedKid();
      if (!kid) return;
      if (weekOffset !== 0) {
        // Viewing last week — row tap shouldn't log "today"; use dots instead
        showToast('Tap a day circle to log or undo');
        return;
      }
      const todays = todaysChoreEntries(kid.id, id);
      if (todays.length && !chore.allowMultiple) {
        if (confirm(`Undo "${chore.name}" for today? This removes the $${Number(chore.amount).toFixed(2)} earned.`)) {
          undoChoreOnDate(kid.id, id, localDateKey());
        }
        return;
      }
      logChore(id);
    });
  });
  root.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); requireUnlock(() => openChoreModal(btn.dataset.edit)); };
  });
  root.querySelectorAll('[data-day-chore]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      if (btn.disabled) return;
      const choreId = btn.dataset.dayChore;
      const dateKey = btn.dataset.dayKey;
      const act = () => toggleChoreDay(choreId, dateKey);
      // Editing a past week is PIN-gated; current week day taps are open (kids can log)
      if (weekOffset !== 0) requireUnlock(act);
      else act();
    };
  });
}
function toggleChoreDay(choreId, dateKey){
  const kid = selectedKid();
  if (!kid) return;
  const chore = state.chores.find(c => c.id === choreId);
  if (!chore) return;
  const dayStart = dateFromKey(dateKey); dayStart.setHours(0,0,0,0);
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  if (dayStart.getTime() > todayStart.getTime()) {
    showToast('That day is in the future');
    return;
  }
  const existing = choreEntriesOnDate(kid.id, choreId, dateKey);
  if (existing.length && !chore.allowMultiple) {
    const label = dateKey === localDateKey() ? 'today' : dateKey;
    if (confirm(`Undo "${chore.name}" for ${label}? This removes the $${Number(chore.amount).toFixed(2)} earned.`)) {
      undoChoreOnDate(kid.id, choreId, dateKey);
    }
    return;
  }
  logChoreOnDate(choreId, dateKey);
}
function undoChoreOnDate(kidId, choreId, dateKey){
  const entries = choreEntriesOnDate(kidId, choreId, dateKey);
  if (!entries.length) return;
  const chore = state.chores.find(c => c.id === choreId);
  const toRemove = chore && chore.allowMultiple ? [entries.sort((a,b)=>b.ts-a.ts)[0]] : entries;
  const ids = new Set(toRemove.map(e => e.id));
  state.entries = state.entries.filter(e => !ids.has(e.id));
  lastAction = null;
  render();
  showToast('Undone');
}
function undoTodayChore(kidId, choreId){
  undoChoreOnDate(kidId, choreId, localDateKey());
}
function logChoreOnDate(choreId, dateKey){
  const kid = selectedKid();
  if (!kid) return;
  const chore = state.chores.find(c => c.id === choreId);
  if (!chore) return;
  const existing = choreEntriesOnDate(kid.id, choreId, dateKey);
  if (existing.length && !chore.allowMultiple) {
    showToast('Already logged that day');
    return;
  }
  const dayStart = dateFromKey(dateKey); dayStart.setHours(0,0,0,0);
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  if (dayStart.getTime() > todayStart.getTime()) {
    showToast('That day is in the future');
    return;
  }
  // Stamp entry at noon that day (or now if today) so it sorts sensibly and matches the date key
  let ts = dateFromKey(dateKey).getTime();
  if (dateKey === localDateKey()) ts = Date.now();
  const entry = { id: uid('e'), kidId: kid.id, type: 'chore', choreId: chore.id,
    name: chore.name, amount: Number(chore.amount), ts, emoji: chore.emoji };
  state.entries.push(entry);
  lastAction = { type: 'add', kidId: kid.id, entryId: entry.id };
  render();
  const when = dateKey === localDateKey() ? '' : ` (${dateKey})`;
  showToast(`${chore.emoji||'⭐'} ${chore.name} +${money(chore.amount)}${when}`, true);
}

function renderChores(){
  const el = document.getElementById('choreList');
  const kid = selectedKid();
  const kidId = kid ? kid.id : null;

  // Week summary (Sun–Sat of viewed week)
  if (kidId) {
    const st = weekStats(kidId);
    const tp = document.getElementById('todayProgress');
    const te = document.getElementById('todayEarned');
    const wl = document.getElementById('weekLabel');
    if (tp) tp.textContent = `${st.count} chore${st.count===1?'':'s'}`;
    if (te) te.textContent = `${money(st.earned)} earned`;
    if (wl) wl.textContent = (weekOffset === 0 ? 'This week' : 'Last week') + ' · ' + fmtWeekRange();
    const prev = document.getElementById('btnPrevWeek');
    const cur = document.getElementById('btnThisWeek');
    if (prev) prev.classList.toggle('hidden', weekOffset !== 0);
    if (cur) cur.classList.toggle('hidden', weekOffset === 0);
  }

  if (!state.chores.length) {
    el.innerHTML = '<div class="empty">No chores yet. Tap + Add.</div>';
    return;
  }
  if (!kidId) {
    el.innerHTML = '<div class="empty">Add a kid to get started</div>';
    return;
  }
  const byCat = {};
  for (const c of state.chores) {
    const cat = c.category || CATEGORY_BY_NAME[String(c.name||'').trim().toLowerCase()] || 'general';
    if (!c.category) c.category = cat;
    (byCat[cat] = byCat[cat] || []).push(c);
  }
  el.innerHTML = CATEGORIES.map(cat => {
    const items = byCat[cat.id] || [];
    if (!items.length) return '';
    const collapsed = isCategoryCollapsed(cat.id);
    const weekKeys = new Set(weekDayKeys());
    const doneCount = items.filter(c => state.entries.some(e =>
      e.kidId===kidId && e.type==='chore' && e.choreId===c.id && weekKeys.has(localDateKey(e.ts))
    )).length;
    return `<div class="cat-section ${collapsed?'collapsed':''}" data-cat="${cat.id}">
      <button type="button" class="cat-header" data-toggle-cat="${cat.id}" aria-expanded="${!collapsed}">
        <span class="cat-emoji">${cat.emoji}</span>
        <span class="cat-title">${escapeHtml(cat.name)}</span>
        <span class="cat-progress">${doneCount}/${items.length} this week</span>
        <span class="cat-chevron">▼</span>
      </button>
      <div class="cat-body">${items.map(c => choreItemHtml(c, kidId)).join('')}</div>
    </div>`;
  }).join('');
  const known = new Set(CATEGORIES.map(c => c.id));
  const orphans = Object.keys(byCat).filter(k => !known.has(k));
  if (orphans.length) {
    const extra = orphans.flatMap(k => byCat[k]);
    el.insertAdjacentHTML('beforeend', `<div class="cat-section" data-cat="orphan">
      <button type="button" class="cat-header"><span class="cat-emoji">🏠</span>
      <span class="cat-title">Other</span><span class="cat-progress">0/${extra.length} done</span></button>
      <div class="cat-body">${extra.map(c => choreItemHtml(c, kidId)).join('')}</div></div>`);
  }
  el.querySelectorAll('[data-toggle-cat]').forEach(btn => {
    btn.onclick = (e) => { e.preventDefault(); toggleCategory(btn.dataset.toggleCat); };
  });
  bindChoreRows(el);
}


function avgChoreAmount(){
  if (!state.chores.length) return 1;
  const sum = state.chores.reduce((s,c)=>s+Number(c.amount||0),0);
  return Math.max(0.25, sum / state.chores.length);
}
function renderGoals(){
  const kid = selectedKid();
  const el = document.getElementById('goalsList');
  const achEl = document.getElementById('achievedList');
  const wrap = document.getElementById('achievedWrap');
  if (!kid) { el.innerHTML=''; achEl.innerHTML=''; wrap.classList.add('hidden'); return; }
  const bal = balanceFor(kid.id);
  const active = (state.goals||[]).filter(g => g.kidId===kid.id && !g.achieved);
  const done = (state.goals||[]).filter(g => g.kidId===kid.id && g.achieved)
    .slice().sort((a,b)=>(b.achievedAt||0)-(a.achievedAt||0));
  const avg = avgChoreAmount();

  const tileHtml = (g, {achieved=false}={}) => {
    const price = Math.max(0.01, Number(g.price)||0);
    const pct = achieved ? 100 : Math.min(100, Math.round((bal / price) * 1000) / 10);
    const toGo = Math.max(0, Math.round((price - bal)*100)/100);
    const ready = !achieved && bal + 0.001 >= price;
    const grey = achieved ? 0 : Math.max(0, Math.min(100, 100 - pct));
    const fade = achieved ? 1 : Math.max(0.55, pct / 100);
    const thumb = g.photo
      ? `<img src="${g.photo}" alt="" style="filter: grayscale(${grey}%) opacity(${fade});">`
      : `<div class="goal-tile-emoji">${g.emoji||'🎯'}</div>`;
    const togoText = achieved ? `Bought ${money(g.price)}` : (ready ? 'Ready! 🎉' : `${money(toGo)} to go`);
    return `<button type="button" class="goal-tile ${ready?'ready':''} ${achieved?'achieved':''}" data-goal-open="${g.id}">
      <div class="goal-tile-thumb">${thumb}</div>
      <div class="goal-tile-name">${escapeHtml(g.name)}</div>
      <div class="goal-tile-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
        <span style="width:${pct}%"></span>
      </div>
      <div class="goal-tile-togo">${togoText}</div>
    </button>`;
  };

  const addTile = `<button type="button" class="goal-tile goal-tile-add" id="btnAddGoalTile">＋ Add goal</button>`;
  el.innerHTML = `<div class="goals-grid">${active.map(g => tileHtml(g)).join('')}${addTile}</div>`;

    wrap.classList.remove('hidden');
    achEl.innerHTML = `<div class="achieved-grid">${done.map(g => tileHtml(g, {achieved:true})).join('')}</div>`;

    wrap.classList.add('hidden');

  });
  achEl.querySelectorAll('[data-goal-open]').forEach(btn => {
    btn.onclick = () => openDetail(btn.dataset.goalOpen);
  });
  const addTileBtn = document.getElementById('btnAddGoalTile');
  if (addTileBtn) addTileBtn.onclick = () => requireUnlock(() => openGoalModal());
}

function openGoalDetail(id){
  const kid = selectedKid();
  const g = (state.goals||[]).find(x => x.id === id);
  if (!kid || !g) return;
  const bal = balanceFor(kid.id);
  const price = Math.max(0.01, Number(g.price)||0);
  const pct = g.achieved ? 100 : Math.min(100, Math.round((bal / price) * 1000) / 10);
  const saved = g.achieved ? price : Math.min(bal, price);
  const toGo = Math.max(0, Math.round((price - bal)*100)/100);
  const ready = !g.achieved && bal + 0.001 >= price;
  const avg = avgChoreAmount();
  const choresLeft = ready || g.achieved ? 0 : Math.ceil(toGo / avg);
  const grey = g.achieved ? 0 : Math.max(0, Math.min(100, 100 - pct));
  const fade = g.achieved ? 1 : Math.max(0.55, pct / 100);
  const photoBlock = g.photo
    ? `<img class="detail-photo" id="detailPhoto" src="${g.photo}" alt="${escapeHtml(g.name)}"
         style="filter: grayscale(${grey}%) opacity(${fade}); cursor:zoom-in">`
    : `<div class="detail-photo-fallback">${g.emoji||'🎯'}</div>`;

  openModal(`
    <h2>${escapeHtml(g.emoji||'🎯')} ${escapeHtml(g.name)}</h2>
    ${photoBlock}
    <div class="goal-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" style="margin-bottom:10px">
      <div class="goal-bar-fill" style="width:${pct}%"></div>
    </div>
    <div class="goal-progress-text" style="margin-bottom:8px">
      <span class="saved">${money(saved)} saved of ${money(price)}</span>
      <span class="togo">${g.achieved ? 'Bought!' : (ready ? 'Ready!' : money(toGo) + ' to go')}</span>
    </div>
    ${g.achieved
      ? `<div class="goal-estimate">Bought${g.achievedAt? ' · '+fmtDate(g.achievedAt):''}</div>`
      : (ready
          ? `<div class="goal-ready-badge">Ready! 🎉</div>`
          : `<div class="goal-estimate">~${choresLeft} more chore${choresLeft===1?'':'s'} (avg ${money(avg)})</div>`)}
    <div class="modal-actions" style="flex-direction:column;margin-top:14px">
      ${!g.achieved && ready ? `<button class="btn btn-accent" id="dBuy">Mark as Bought</button>` : ''}
      ${!g.achieved ? `<button class="btn btn-outline" id="dEdit">✏️ Edit</button>` : ''}
      <button class="btn btn-danger" id="dDel">${g.achieved?'Remove from Achieved':'Delete goal'}</button>
      <button class="btn btn-outline" id="dClose">Close</button>
    </div>`);

  const photo = document.getElementById('detailPhoto');
  if (photo) photo.onclick = () => openLightbox(g.photo);
  document.getElementById('dClose').onclick = closeModal;
  const edit = document.getElementById('dEdit');
  if (edit) edit.onclick = () => requireUnlock(() => openGoalModal(g.id));
  const buy = document.getElementById('dBuy');
  if (buy) buy.onclick = () => requireUnlock(() => buyGoal(g.id));
  document.getElementById('dDel').onclick = () => requireUnlock(() => {
    state.goals = state.goals.filter(x => x.id !== g.id);
    closeModal(); render(); showToast(g.achieved ? 'Removed from Achieved' : 'Goal removed');
  });
}

function compressImageFile(file, maxSide = 600, quality = 0.75){
  return new Promise(async (resolve, reject) => {
    if (!file) { reject(new Error('no file')); return; }
    const type = (file.type || '').toLowerCase();
    // iOS may give empty type or image/heic — still try to decode
    const looksImage = !type || type.startsWith('image/') || /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(file.name||'');
    if (!looksImage) { reject(new Error('not an image')); return; }

    const drawToDataUrl = (source, w0, h0) => {
      let w = w0, h = h0;
      if (!w || !h) throw new Error('bad size');
      const scale = Math.min(1, maxSide / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(source, 0, 0, w, h);
      let dataUrl = canvas.toDataURL('image/jpeg', quality);
      if (dataUrl.length > 450000) dataUrl = canvas.toDataURL('image/jpeg', 0.55);
      if (dataUrl.length > 700000) dataUrl = canvas.toDataURL('image/jpeg', 0.4);
      return dataUrl;
    };

    // Prefer createImageBitmap (handles many formats iOS converts for us)
    if (typeof createImageBitmap === 'function') {
      try {
        const bmp = await createImageBitmap(file);
        try {
          const dataUrl = drawToDataUrl(bmp, bmp.width, bmp.height);
          try { bmp.close && bmp.close(); } catch(e){}
          resolve(dataUrl);
          return;
        } catch (e) {
          try { bmp.close && bmp.close(); } catch(e2){}
          // fall through to Image()
        }
      } catch (e) {
        // fall through
      }
    }

    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const dataUrl = drawToDataUrl(img, img.naturalWidth || img.width, img.naturalHeight || img.height);
        URL.revokeObjectURL(url);
        resolve(dataUrl);
      } catch (e) {
        URL.revokeObjectURL(url);
        reject(e);
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load fail')); };
    img.src = url;
  });
}

function buyGoal(id){

  const g = state.goals.find(x => x.id === id);
  if (!kid || !g || g.achieved) return;
  const price = Math.round(Number(g.price)*100)/100;
  const bal = balanceFor(kid.id);
  if (price > bal + 0.001) { showToast('Not enough saved yet'); return; }
  const entry = { id: uid('e'), kidId: kid.id, type: 'payout', name: 'Bought: ' + g.name,

  g.achieved = true;
  g.achievedAt = Date.now();
  lastAction = { type: 'add', kidId: kid.id, entryId: entry.id };

}

  lastAction = { type: 'add', kidId: kid.id, entryId: entry.id };

  render();
  showToast(`Paid ${money(amt)}`, true);

      <button class="chip" data-amt="10">$10</button>
      <button class="chip" data-amt="1">$1</button>
    </div>
    <div class="field"><label>Custom amount</label>
      <input type="number" id="payoutAmt" min="0.01" step="0.01" value="${bal.toFixed(2)}" inputmode="decimal">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">Cancel</button>
      <button class="btn btn-accent" id="mPay">Pay</button>
    </div>`);
  const input = document.getElementById('payoutAmt');
  document.querySelectorAll('[data-amt]').forEach(c => c.onclick = () => {
    document.querySelectorAll('[data-amt]').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    input.value = Number(c.dataset.amt).toFixed(2);
  });
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mPay').onclick = () => doPayout(input.value);
}

function openChoreModal(id){
  const c = id ? state.chores.find(x => x.id===id) : { name:'', amount:1, emoji:'⭐', category: suggestedCategoryId() };
  const isNew = !id;
  let cat = (c && c.category) || suggestedCategoryId() || 'general';
  openModal(`
    <h2>${isNew?'Add chore':'Edit chore'}</h2>
    <div class="field"><label>Emoji</label><input id="chEmoji" maxlength="16" inputmode="text" autocomplete="off" value="${escapeHtml(c.emoji||'⭐')}"></div>
    <div class="field"><label>Name</label><input id="chName" value="${escapeHtml(c.name||'')}" placeholder="Chore name"></div>
    <div class="field"><label>Amount ($)</label><input id="chAmt" type="number" min="0" step="0.25" value="${c.amount||1}" inputmode="decimal"></div>
    <div class="field"><label class="field-check"><input type="checkbox" id="chMulti" ${c.allowMultiple?'checked':''}> Can do more than once a day</label></div>
    <div class="field"><label>Category</label>
      <div class="cat-picker" id="catPick">
        ${CATEGORIES.map(x => `<button type="button" class="cat-pick ${x.id===cat?'active':''}" data-cat="${x.id}">${x.emoji} ${escapeHtml(x.name)}</button>`).join('')}
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">Cancel</button>
      ${!isNew?'<button class="btn btn-danger" id="mDel">Delete</button>':''}
      <button class="btn btn-primary" id="mSave" style="background:var(--primary);color:#fff">Save</button>
    </div>`);
  document.querySelectorAll('#catPick [data-cat]').forEach(b => b.onclick = () => {
    cat = b.dataset.cat;
    document.querySelectorAll('#catPick [data-cat]').forEach(x => x.classList.toggle('active', x.dataset.cat===cat));
  });
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mSave').onclick = () => {
    const name = document.getElementById('chName').value.trim();
    const amount = Number(document.getElementById('chAmt').value);
    const emoji = document.getElementById('chEmoji').value.trim() || '⭐';
    if (!name) { showToast('Name required'); return; }
    if (!(amount >= 0)) { showToast('Invalid amount'); return; }
    const allowMultiple = !!document.getElementById('chMulti').checked;
    if (isNew) state.chores.push({ id: uid('c'), name, amount, emoji, category: cat, allowMultiple });
    else { c.name=name; c.amount=amount; c.emoji=emoji; c.category=cat; c.allowMultiple=allowMultiple; }
    closeModal(); render();
  };
  const del = document.getElementById('mDel');
  if (del) del.onclick = () => {
    state.chores = state.chores.filter(x => x.id !== id);
    closeModal(); render(); showToast('Chore removed');
  };
}

function openKidModal(id){
  const k = id ? state.kids.find(x => x.id===id) : null;
  const isNew = !k;
  openModal(`
    <h2>${isNew?'Add kid':'Edit kid'}</h2>
    <div class="field"><label>Name</label><input id="kidName" value="${escapeHtml(k?k.name:'')}" placeholder="Name"></div>
    <div class="field"><label>Color</label>
      <div class="quick-amts" id="colorPick">
        ${COLORS.map(col => `<button class="chip ${(k&&k.color===col)?'active':''}" data-color="${col}" style="background:${col};color:#fff;border:3px solid ${(k&&k.color===col)?'#1E1B4B':'transparent'}">&nbsp;</button>`).join('')}
      </div>
      <input type="hidden" id="kidColor" value="${k?k.color:COLORS[state.kids.length%COLORS.length]}">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">Cancel</button>
      ${!isNew?'<button class="btn btn-danger" id="mDel">Remove</button>':''}
      <button class="btn btn-primary" id="mSave" style="background:var(--primary);color:#fff">Save</button>
    </div>`);
  let color = document.getElementById('kidColor').value;
  document.querySelectorAll('[data-color]').forEach(b => b.onclick = () => {
    color = b.dataset.color;
    document.getElementById('kidColor').value = color;
    document.querySelectorAll('[data-color]').forEach(x => x.style.borderColor = 'transparent');
    b.style.borderColor = '#1E1B4B';
  });
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mSave').onclick = () => {
    const name = document.getElementById('kidName').value.trim();
    if (!name) { showToast('Name required'); return; }
    if (isNew) {
      const nk = { id: uid('k'), name, color };
      state.kids.push(nk); state.selectedKidId = nk.id;
    } else { k.name = name; k.color = color; }
    closeModal(); render();
  };
  const del = document.getElementById('mDel');
  if (del) del.onclick = () => {
    if (state.kids.length <= 1) { showToast('Need at least one kid'); return; }
    state.entries = state.entries.filter(e => e.kidId !== k.id);
    state.goals = (state.goals||[]).filter(g => g.kidId !== k.id);
    state.kids = state.kids.filter(x => x.id !== k.id);
    state.selectedKidId = state.kids[0].id;
    closeModal(); render(); showToast('Kid removed');
  };
}

function openMenu(){
  openModal(`
    <h2>Settings</h2>
    <div class="modal-actions" style="flex-direction:column">
      <button class="btn btn-outline" id="mEditKids">✏️ Edit kids</button>
      <button class="btn btn-outline" id="mPin">${state.pinHash?'🔐 Change / remove PIN':'🔐 Set parent PIN'}</button>
      <button class="btn btn-outline" id="mExport">⬇️ Export backup</button>
      <button class="btn btn-outline" id="mImport">⬆️ Import backup</button>
      <button class="btn btn-outline" id="mClose">Close</button>
    </div>`);
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mEditKids').onclick = () => requireUnlock(openKidsManage);
  document.getElementById('mPin').onclick = () => {

    else openPinSetup();

function openPinSetup(){
  openModal(`
    <h2>Parent PIN</h2>
    <p style="color:var(--muted);margin:0 0 12px;font-size:.95rem">Locks editing chores/kids, payouts, and imports. Kids can still log chores.</p>
    <div class="field"><label>New 4-digit PIN (blank to remove)</label>
      <input id="pinNew" type="password" inputmode="numeric" maxlength="8" pattern="[0-9]*" placeholder="••••">
    </div>
    <div class="field"><label>Confirm</label>
      <input id="pinConf" type="password" inputmode="numeric" maxlength="8" pattern="[0-9]*" placeholder="••••">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">Cancel</button>
      <button class="btn btn-primary" id="mSave" style="background:var(--primary);color:#fff">Save</button>
    </div>`);
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mSave').onclick = async () => {
    const a = document.getElementById('pinNew').value.trim();
    const b = document.getElementById('pinConf').value.trim();
    if (!a) { state.pinHash = null; unlocked = true; closeModal(); render(); showToast('PIN removed'); return; }
    if (!/^\d{4,8}$/.test(a)) { showToast('PIN must be 4–8 digits'); return; }
    if (a !== b) { showToast('PINs do not match'); return; }
    state.pinHash = await hashPin(a);
    unlocked = true;
    closeModal(); render(); showToast('PIN saved');
  };
}

function openPinModal(title){
  let pin = '';
  openModal(`
    <h2>${escapeHtml(title)}</h2>
    <div class="pin-dots" id="pinDots">
      ${[0,1,2,3].map(()=>'<div class="pin-dot"></div>').join('')}
    </div>
    <div class="pin-pad">
      ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k =>
        k==='' ? '<div></div>' : `<button class="pin-key" data-k="${k}">${k}</button>`
      ).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-outline" id="mCancel">Cancel</button></div>`);
  const dots = () => {
    const ds = document.querySelectorAll('#pinDots .pin-dot');
    ds.forEach((d,i) => d.classList.toggle('filled', i < pin.length));
  };
  const trySubmit = async () => {
    if (pin.length < 4) return;
    const h = await hashPin(pin);
    if (h === state.pinHash) {
      unlocked = true;
      const act = pendingPinAction; pendingPinAction = null;
      closeModal(); render();
      if (act) act();
    } else {
      pin = ''; dots(); showToast('Wrong PIN');
    }
  };
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === '⌫') pin = pin.slice(0,-1);
    else if (pin.length < 8) pin += k;
    dots();
    if (pin.length >= 4) trySubmit();
  });
  document.getElementById('mCancel').onclick = () => { pendingPinAction=null; closeModal(); };
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `chore-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Backup downloaded');
  closeModal();
}
function openImport(){
  openModal(`
    <h2>Import backup</h2>
    <p style="color:var(--muted);font-size:.9rem">Paste JSON or choose a file. This replaces current data.</p>
    <div class="field"><label>Backup file</label><input type="file" id="impFile" accept="application/json,.json"></div>
    <div class="field"><label>Or paste JSON</label><textarea id="impText" placeholder='{"kids":...}'></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">Cancel</button>
      <button class="btn btn-danger" id="mImport">Import</button>
    </div>`);
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('impFile').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    document.getElementById('impText').value = await f.text();
  };
  document.getElementById('mImport').onclick = () => {
    try {
      const data = JSON.parse(document.getElementById('impText').value);
      if (!data.kids || !data.chores || !Array.isArray(data.entries)) throw new Error('Invalid backup');
      state = data;
      if (!Array.isArray(state.goals)) state.goals = [];
      if (!state.collapsedCategories || typeof state.collapsedCategories !== 'object') state.collapsedCategories = {};
      if (state.choresDataVersion == null) state.choresDataVersion = 0;
      migrateChores(state);
      if (!state.selectedKidId && state.kids[0]) state.selectedKidId = state.kids[0].id;
      unlocked = !state.pinHash;
      lastAction = null;
      closeModal(); render(); showToast('Backup imported');
    } catch(err) { showToast('Invalid JSON backup'); }
  };
}

let swRegistration = null;
let refreshingPage = false;
let refreshInFlight = false;

async function checkForAppUpdate({ forceReload = false, silent = false } = {}) {
  if (refreshInFlight) return;
  refreshInFlight = true;
  const btn = document.getElementById('btnRefresh');
  if (btn) btn.classList.add('spinning');
  if (!silent) showToast('Updating…');
  try {
    if (!('serviceWorker' in navigator)) {
      if (forceReload) location.reload();
      else if (!silent) showToast('Up to date');
      return;
    }
    let reg = swRegistration || await navigator.serviceWorker.getRegistration();
    if (!reg) {
      try { reg = await navigator.serviceWorker.register('./sw.js'); swRegistration = reg; }
      catch(e) { reg = null; }
    }
    if (!reg) {
      if (forceReload) location.reload();
      else if (!silent) showToast('Up to date');
      return;
    }
    swRegistration = reg;
    try { await reg.update(); } catch(e) {}
    // If a waiting worker exists, tell it to activate (sw already calls skipWaiting on install,
    // but postMessage helps older cached workers; then controllerchange reloads).
    if (reg.waiting) {
      try { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch(e) {}
      // Also call skipWaiting if exposed — message handler in sw.js handles it
      if (!silent) showToast('Updating…');
      // controllerchange listener will reload; fallback timer
      setTimeout(() => { if (!refreshingPage) location.reload(); }, 1200);
      return;
    }
    // No waiting worker — either already current, or update installed into waiting asynchronously
    await new Promise(r => setTimeout(r, 400));
    if (reg.waiting) {
      try { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch(e) {}
      setTimeout(() => { if (!refreshingPage) location.reload(); }, 1200);
      return;
    }
    if (forceReload) {
      location.reload();
      return;
    }
    if (!silent) showToast('Up to date');
  } finally {
    refreshInFlight = false;
    if (btn) btn.classList.remove('spinning');
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshingPage) return;
    refreshingPage = true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      swRegistration = reg;
      if (reg) {
        reg.update().catch(()=>{});
        setInterval(() => reg.update().catch(()=>{}), 60 * 60 * 1000);
      }
    }).catch(()=>{});
  });
}


let lastSeenDateKey = localDateKey();
let lastSeenWeekStart = startOfWeek();
function refreshIfNewDay(){
  const key = localDateKey();
  const weekStart = startOfWeek();
  const newDay = key !== lastSeenDateKey;
  const newWeek = weekStart !== lastSeenWeekStart;
  lastSeenDateKey = key;
  lastSeenWeekStart = weekStart;
  if (newWeek) weekOffset = 0;
  // Re-render on resume / day change so Sunday rollover clears dots
  render();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refreshIfNewDay();
});
window.addEventListener('focus', refreshIfNewDay);
setInterval(() => {
  const key = localDateKey();
  if (key !== lastSeenDateKey) {
    lastSeenDateKey = key;
    render();
  }
}, 60 * 1000);

document.getElementById('btnPrevWeek').onclick = () => { weekOffset = -1; render(); };

document.getElementById('btnRefresh').onclick = () => checkForAppUpdate({ forceReload: true });

/* Simple pull-to-refresh at scroll top (iOS standalone friendly) */
(function setupPullToRefresh(){
  const ind = document.getElementById('ptrIndicator');
  let startY = 0, pulling = false, armed = false;
  const THRESH = 70;
  const onStart = (y) => {
    if (window.scrollY > 2 || document.documentElement.scrollTop > 2) { pulling = false; return; }
    startY = y; pulling = true; armed = false;
  };
  const onMove = (y) => {
    if (!pulling) return;
    const dy = y - startY;
    if (dy > 10) {
      ind.classList.add('show');
      ind.textContent = dy > THRESH ? '↑ Release to refresh' : '↓ Pull to refresh';
      armed = dy > THRESH;
    }
  };
  const onEnd = () => {
    if (!pulling) return;
    pulling = false;
    ind.classList.remove('show');
    if (armed) checkForAppUpdate({ forceReload: true });
    armed = false;
  };
  window.addEventListener('touchstart', (e) => { if (e.touches[0]) onStart(e.touches[0].clientY); }, { passive: true });
  window.addEventListener('touchmove', (e) => { if (e.touches[0]) onMove(e.touches[0].clientY); }, { passive: true });
  window.addEventListener('touchend', onEnd, { passive: true });
  window.addEventListener('touchcancel', onEnd, { passive: true });
})();

render();
